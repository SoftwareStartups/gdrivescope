[package]
name = "gdrivescope"
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
description = "Google Drive indexing, search, and download CLI"
license = "MIT"
repository = "https://github.com/SoftwareStartups/gdrivescope"
publish = false

[[bin]]
name = "gdrivescope"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "sync", "signal"] }

# SQLite + sqlite-vec. The `bundled` feature compiles SQLite from source so
# we don't depend on a system libsqlite3 dylib at runtime.
rusqlite = { version = "0.39", features = ["bundled"] }
sqlite-vec = "0.1"
bytemuck = "1"
dirs = "5"

# Auth: keychain vault + OAuth loopback PKCE. Loopback is hand-rolled on
# `tokio::net::TcpListener` instead of `yup-oauth2` — yup-oauth2's
# `TokenStorage` trait would force a wrapper around our `Vault` bigger than
# the loopback flow itself.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
rpassword = "7"
open = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
async-trait = "0.1"

# Drive: hand-rolled reqwest calls to the three REST endpoints we use
# (`files.list`, `files.get`, `files.export`). google-drive3 ships a huge
# generated surface, OpenSSL by default, and tight coupling to yup-oauth2.
futures = "0.3"

# Document extraction: native Rust Kreuzberg with the pure-Rust pdf-oxide
# backend — no libpdfium runtime dep, single static binary preserved.
# `office` covers DOCX/PPTX, `excel` covers XLSX/XLS/ODS via calamine.
kreuzberg = { version = "4", default-features = false, features = ["pdf", "pdf-oxide", "office", "excel", "html", "xml", "email", "tokio-runtime"] }

# Archive recursion: open zip envelopes (e.g. Docusign exports) and feed
# each inner document back through the extractor. Pure Rust, no system deps.
zip = { version = "8", default-features = false, features = ["deflate"] }

# LLM + embedding HTTP clients (~80 LOC each on top of the shared
# `llm::http` helper). Hand-rolled because rig-core's builder/storage
# abstractions don't accommodate the per-provider quirks (Anthropic
# tool_use+cache_control, OpenAI strict JSON, Ollama format+retry, Voyage
# output_dimension) without provider-specific shims that match hand-roll
# size.
backon = "1"

tempfile = "3"
toml = "0.8"

# macOS-only: keyring v3 doesn't expose an ACL parameter, so generic-
# password entries it creates are scoped to the writing binary's codesign
# identity — each fresh `cargo build` produces a new ad-hoc identifier and
# the OS prompts on every read of an existing entry. We bypass this by
# writing our vault entry directly via `SecAccessCreate(trustedlist=NULL)`
# + `SecItemAdd(kSecAttrAccess=…)`. See `src/auth/vault.rs::macos_unrestricted`.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = "2"

[dev-dependencies]
mockito = "1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
