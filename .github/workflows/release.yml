name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
            install_linux_deps: true
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
            install_linux_deps: true
          - runner: macos-15
            os: darwin
            arch: arm64
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
            install_linux_deps: false
          - runner: windows-latest
            os: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
            install_linux_deps: false
          - runner: windows-11-arm
            os: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            ext: ".exe"
            archive: zip
            install_linux_deps: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain comes from rust-toolchain.toml; we add the cross-target.
      - name: Add target ${{ matrix.target }}
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # libdbus-1-dev: keyring's `sync-secret-service` backend transitively
      # depends on libdbus-sys, whose build script requires libdbus headers
      # and pkg-config to find them.
      - name: Install Linux build deps
        if: matrix.install_linux_deps == true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build release
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p staged
          cp "target/${{ matrix.target }}/release/gdrivescope${{ matrix.ext }}" \
             "staged/gdrivescope-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

      # macOS: confirm cargo's linker emitted an ad-hoc signature so the binary
      # doesn't SIGKILL on Sequoia+. The macos-* runner's linker signs
      # automatically; this is just a guard.
      - name: Verify ad-hoc signature (macOS)
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          codesign -dvv "staged/gdrivescope-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" 2>&1 | tee codesign.log
          grep -q "Signature=adhoc" codesign.log

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd staged
          tar czf "gdrivescope-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            "gdrivescope-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "staged/gdrivescope-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" `
            -DestinationPath "staged/gdrivescope-${{ matrix.os }}-${{ matrix.arch }}.zip"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdrivescope-${{ matrix.os }}-${{ matrix.arch }}
          path: staged/gdrivescope-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}
          retention-days: 1

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG_NAME" artifacts/* --generate-notes --repo "$REPO"
