name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Toolchain is pinned via rust-toolchain.toml; the runner's pre-installed
      # rustup picks it up automatically. No third-party action needed (keeps
      # the SHA-pinning surface minimal).
      - name: Show toolchain
        run: rustup show && rustc --version && cargo --version

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      # Cross-compile smoke test for the static-musl Linux target. Catches any
      # dep that doesn't compile under musl before tag time, where the full
      # release matrix would otherwise be the first warning.
      - name: Cross-compile check (musl)
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo check --release --target x86_64-unknown-linux-musl
