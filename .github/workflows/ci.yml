name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Toolchain is pinned via rust-toolchain.toml; the runner's pre-installed
      # rustup picks it up automatically. No third-party action needed (keeps
      # the SHA-pinning surface minimal).
      - name: Show toolchain
        run: rustup show && rustc --version && cargo --version

      # libdbus-1-dev: keyring's `sync-secret-service` backend transitively
      # depends on libdbus-sys, whose build script needs libdbus headers.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release
