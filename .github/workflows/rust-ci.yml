name: Rust CI

on:
  push:
    branches: ["**"]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Toolchain is pinned via rust/rust-toolchain.toml; the runner's pre-
      # installed rustup picks it up automatically. No third-party action
      # needed (keeps the SHA-pinning surface minimal during the migration).
      - name: Show toolchain
        run: rustup show && rustc --version && cargo --version

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      # Phase 10 (Distribution) will add cargo-dist and a release matrix that
      # supersedes both this and the existing TS release.yml. Phase 1 CI is
      # intentionally minimal.
