name: Rust Release

# Triggered by `rust-v*` tags during the migration window so it doesn't
# collide with the existing `v*` TS releases. Phase 11 cutover replaces the
# TS `release.yml` and switches this back to plain `v*`.
on:
  push:
    tags:
      - "rust-v*"

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
            target: x86_64-unknown-linux-musl
            ext: ""
            archive: tar.gz
            install_musl: true
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
            install_musl: false
          - runner: macos-13
            os: darwin
            arch: x64
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
            install_musl: false
          - runner: macos-15
            os: darwin
            arch: arm64
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
            install_musl: false
          - runner: windows-latest
            os: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
            install_musl: false
          - runner: windows-11-arm
            os: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            ext: ".exe"
            archive: zip
            install_musl: false

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Toolchain comes from rust/rust-toolchain.toml, but we add the target.
      - name: Add target ${{ matrix.target }}
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools (Linux x64 only)
        if: matrix.install_musl == true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p staged
          cp "target/${{ matrix.target }}/release/gdrivescope${{ matrix.ext }}" \
             "staged/gdrivescope-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

      # macOS: confirm cargo's linker emitted an ad-hoc signature so the
      # binary doesn't SIGKILL on Sequoia+ (memory: locally-compiled bun
      # binaries had this issue; cargo-built ones should be signed
      # automatically by the macos-* runner's linker).
      - name: Verify ad-hoc signature (macOS)
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          codesign -dvv "staged/gdrivescope-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" 2>&1 | tee codesign.log
          grep -q "Signature=adhoc" codesign.log

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd staged
          tar czf "gdrivescope-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            "gdrivescope-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "staged/gdrivescope-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" `
            -DestinationPath "staged/gdrivescope-${{ matrix.os }}-${{ matrix.arch }}.zip"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdrivescope-${{ matrix.os }}-${{ matrix.arch }}
          path: rust/staged/gdrivescope-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.archive }}
          retention-days: 1

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG_NAME" artifacts/* --generate-notes --repo "$REPO" --prerelease
