[package]
name = "gdrivescope"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Google Drive indexing, search, and download CLI"
license = "MIT"
repository = "https://github.com/SoftwareStartups/gdrivescope"
publish = false

[[bin]]
name = "gdrivescope"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "sync", "signal"] }

# Phase 2 (data layer): SQLite + sqlite-vec.
# `bundled` compiles SQLite from source statically — replaces the TS-side
# `setCustomSQLite()` + system dylib hunting from `src/graph/sqlite-native.ts`.
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
bytemuck = "1"
dirs = "5"

# Phase 3 (auth): keychain vault + OAuth loopback PKCE + interactive prompt.
# We hand-roll the loopback flow on `tokio::net::TcpListener` instead of
# pulling in `yup-oauth2` so the on-disk Vault JSON stays byte-equivalent
# to the TS implementation (cross-binary login interop is a Verification §4
# requirement and yup-oauth2's TokenStorage trait would force a wrapper).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rpassword = "7"
open = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
async-trait = "0.1"

# Subsequent phases will add:
#   Phase 4 (drive):      google-drive3
#   Phase 5 (extract):    kreuzberg (bundled-pdfium)
#   Phase 6 (llm):        rig-core + backon
#   Phase 7+ (misc):      toml, tracing, tracing-subscriber

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
