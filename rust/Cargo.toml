[package]
name = "gdrivescope"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Google Drive indexing, search, and download CLI"
license = "MIT"
repository = "https://github.com/SoftwareStartups/gdrivescope"
publish = false

[[bin]]
name = "gdrivescope"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "sync", "signal"] }

# Phase 2 (data layer): SQLite + sqlite-vec.
# `bundled` compiles SQLite from source statically — replaces the TS-side
# `setCustomSQLite()` + system dylib hunting from `src/graph/sqlite-native.ts`.
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
bytemuck = "1"
dirs = "5"

# Phase 3 (auth): keychain vault + OAuth loopback PKCE + interactive prompt.
# We hand-roll the loopback flow on `tokio::net::TcpListener` instead of
# pulling in `yup-oauth2` so the on-disk Vault JSON stays byte-equivalent
# to the TS implementation (cross-binary login interop is a Verification §4
# requirement and yup-oauth2's TokenStorage trait would force a wrapper).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rpassword = "7"
open = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
async-trait = "0.1"

# Phase 4 (drive): hand-rolled reqwest calls to the 3 Drive REST endpoints
# we use (files.list / files.get / files.export). Plan called for
# `google-drive3`, but its huge generated surface, OpenSSL default, and
# tight coupling to `yup-oauth2` (which we already opted out of in Phase 3)
# would have been net more code than the direct REST port.
futures = "0.3"

# Phase 5 (extract): native Rust Kreuzberg.
#
# PDF backend reality (May 2026): the plan-recommended `bundled-pdfium`
# feature in kreuzberg 4.9 is misnamed — it's just an alias for `pdf` and
# expects PDFium to be located at runtime via system paths. The pure-Rust
# `pdf-oxide` backend would be ideal but kreuzberg 4.9.4 references an
# unreleased `pdf_oxide` 0.3.37 (only 0.3.33 is on crates.io as of this
# build). The only "true static" path is `static-pdfium` (~200 MB, rejected
# in the plan's risk section).
#
# Phase 5 ships kreuzberg WITHOUT `pdf` enabled — non-PDF formats (DOCX,
# XLSX, PPTX, HTML, XML, EML, TXT, MD) cover the vast majority of indexed
# documents. PDF extraction returns `EXTRACT_FAILED` and the pipeline
# records the error in `nodes.last_error`, matching how the TS WASM
# version handled corrupt PDFs. Phase 10 (distribution) revisits — by
# then `pdf_oxide` 0.3.37 should have shipped or we ship a side-loaded
# PDFium dylib in the release archive.
kreuzberg = { version = "4", default-features = false, features = ["office", "html", "xml", "email", "tokio-runtime"] }

# Phase 6 (LLM): hand-rolled per-provider reqwest clients. Plan called for
# `rig-core` to unify the 4 LLM + 4 embedding providers, but the same logic
# that ruled out yup-oauth2 (Phase 3) and google-drive3 (Phase 4) applies:
# rig-core owns its own builder/storage abstractions, custom request shapes
# (Anthropic tool_use w/ cache_control, OpenAI json_schema strict, Ollama
# `format` + retry-on-malformed, Voyage output_dimension) leak through, and
# we'd need provider-specific shims. The 8 hand-rolled providers are
# ~120 LOC each.
backon = "1"

tempfile = "3"
toml = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
